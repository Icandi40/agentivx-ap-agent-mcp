[project]
name = "ap-agent-mcp"
version = "0.1.0"
description = "Accounts payable agent that works inside a system of record through an MCP server, with human approval before any write."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",  # uses the 2.x MCPServer API
    "httpx>=0.27",
    "pypdf>=4.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "fpdf2>=2.7",
    "mypy>=2.4.1",
]

[project.scripts]
ap-agent = "ap_agent.cli:main"
ap-agent-mcp = "ap_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # the formatter owns line length

[tool.mypy]
python_version = "3.11"
files = ["src", "evals"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
